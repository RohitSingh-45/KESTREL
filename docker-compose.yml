services:
  kestrel:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: ${PORT:-8000}
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/kestrel.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AGENT_CYCLE_SECONDS: ${AGENT_CYCLE_SECONDS:-600}
      GENERATION_LEASE_SECONDS: ${GENERATION_LEASE_SECONDS:-300}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-3}
      RESEARCH_HTTP_TIMEOUT_SECONDS: ${RESEARCH_HTTP_TIMEOUT_SECONDS:-20}
      RESEARCH_MAX_ITEMS: ${RESEARCH_MAX_ITEMS:-20}
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-5000}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
