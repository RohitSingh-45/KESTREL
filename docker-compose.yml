name: tracex

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracex
      POSTGRES_PASSWORD: tracex
      POSTGRES_DB: tracex
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracex']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment: &backend_env
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://tracex:tracex@postgres:5432/tracex
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: 'true'
      JOB_BACKEND: celery
      DATA_MODE: ${DATA_MODE:-hybrid}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      BLOCKCHAIR_API_KEY: ${BLOCKCHAIR_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
    command: >
      sh -c "python -m scripts.seed_all --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - '8000:8000'
    volumes:
      - reportdata:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    environment: *backend_env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --pool=solo
    volumes:
      - reportdata:/app/var
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  pgdata:
  reportdata:
